name: P2 frozen token-aware self-test

on:
  push:
    branches:
      - feature/route-e-token-aware-20261103
    paths:
      - scripts/route_e_token_aware.py
      - scripts/test_route_e_token_aware_integration.py
      - scripts/route_e_cost_only.py
      - scripts/test_route_e_cost_only.py
      - scripts/route_e_allocation_decomposition.py
      - scripts/route_e_frozen.py
      - scripts/route_e_prompt_ablation.py
      - scripts/route_e_equal_budget.py
      - scripts/train_modernbert_delta.py
      - scripts/ntu_route_e_token_aware.sbatch
      - .github/workflows/p2-token-aware-selftest.yml
  workflow_dispatch:

jobs:
  cpu-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install minimal dependency
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Compile Python and validate Slurm shell syntax
        run: |
          python -m py_compile scripts/route_e_token_aware.py scripts/route_e_cost_only.py scripts/test_route_e_cost_only.py scripts/route_e_allocation_decomposition.py
          bash -n scripts/ntu_route_e_token_aware.sbatch
      - name: Cache-free synthetic self-test
        run: |
          export OPENBLAS_NUM_THREADS=2
          python scripts/route_e_token_aware.py self-test
      - name: Cache-free 1536-D end-to-end integration
        run: |
          export OPENBLAS_NUM_THREADS=2
          python scripts/test_route_e_token_aware_integration.py

      - name: Experiment 1 cost-only CPU tests
        run: |
          export OPENBLAS_NUM_THREADS=2
          python scripts/route_e_cost_only.py self-test
          python scripts/test_route_e_cost_only.py

      - name: Experiment 1B allocation accounting self-test
        run: |
          export OPENBLAS_NUM_THREADS=2
          python scripts/route_e_allocation_decomposition.py self-test

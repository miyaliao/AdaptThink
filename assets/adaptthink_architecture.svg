  <title
     id="title">AdaptThink — Representation-Aware Adaptive Reasoning</title>
  <desc
     id="description">A horizontal architecture diagram. A math question is encoded by either ModernBERT or frozen DeepSeek hidden states. A lightweight linear, logistic, or MLP router scores the representation, selects NoThinking or Thinking, and runs the selected mode on the same frozen DeepSeek-R1-Distill-Qwen-1.5B.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Accuracy versus mean generated-token budget: Route E and full-finetuned ModernBERT</title>
<desc id="chart-description">Strict 450-question validation, seven matched budgets from 900 to 2100 mean generated tokens. Lines for Frozen DeepSeek P0 assistant plus think, P1 assistant only, P2 question only, ModernBERT full fine-tuning classification, and Global Random. P1 is strongest at 1100 to 1700 tokens, P0 at 900, 1900, and 2100. Metrics exclude router inference overhead.</desc>
